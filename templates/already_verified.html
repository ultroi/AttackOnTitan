<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Already Verified</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; }
        .container { background: #fff; padding: 32px 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); text-align: center; min-width: 320px; }
        h2 { color: #2d3a4b; margin-bottom: 16px; }
        .btn { background: #4e8cff; color: #fff; border: none; padding: 10px 32px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container animate__animated animate__fadeIn">
        <h2>Already Verified!</h2>
        <p>User ID: <b>{{ user_id }}</b></p>
        <button class="btn" onclick="window.location.href='https://t.me/Attackon_TitanBot'">Go to Telegram Bot</button>
    </div>
</body>
</html>
