<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Success</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; }
        .container { background: #fff; padding: 32px 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); text-align: center; min-width: 320px; }
        h2 { color: #388e3c; margin-bottom: 16px; }
        .btn { background: #43a047; color: #fff; border: none; padding: 10px 32px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
        .btn:hover { background: #2e7031; }
    </style>
</head>
<body>
    <div class="container animate__animated animate__bounceIn">
        <h2>Verification Successful!</h2>
        <p>You can now continue exploring the game.</p>
        <button class="btn" onclick="window.location.href='/dashboard'">Go to Dashboard</button>
    </div>
</body>
</html>
