<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hCaptcha Timeout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; }
        .container { background: #fff; padding: 32px 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); text-align: center; min-width: 320px; }
        h2 { color: #721c24; margin-bottom: 16px; }
        p { color: #721c24; }
        .btn { background: #f44336; color: #fff; border: none; padding: 10px 32px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
        .btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="container animate__animated animate__shakeX">
        <h2>Verification Timeout</h2>
        <p>You did not complete the hCaptcha in time.<br>You have been banned from further actions.</p>
        <button class="btn" onclick="window.location.href='https://t.me/Attackon_TitanBot'">Go to Telegram Bot</button>
    </div>
</body>
</html>
