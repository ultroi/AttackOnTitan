<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hCaptcha Verification</title>
    <script src="https://hcaptcha.com/1/api.js" async defer></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #fff;
            padding: 32px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            text-align: center;
            min-width: 320px;
        }
        h2 {
            margin-bottom: 24px;
            color: #2d3a4b;
        }
        button[type="submit"] {
            background: #4e8cff;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 18px;
        }
        button[type="submit"]:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Complete hCaptcha to continue</h2>
        <form id="captcha-form" method="POST" action="/verify_hcaptcha">
            <div class="h-captcha" data-sitekey="93e66168-0084-4490-a700-1ffcc1f631e0"></div>
            <input type="hidden" name="user_id" id="user_id" value="">
            <button type="submit">Verify</button>
        </form>
    </div>
    <script>
        // Set user_id from query param
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('user_id').value = urlParams.get('user_id');
    </script>
</body>
</html>
