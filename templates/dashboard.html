<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12161f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AoT Bot Live Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ff5d62;
      --primary-dark: #e54a4f;
      --bg-dark: #0f111a;
      --bg-panel: #1a1e2e;
      --bg-panel-light: #272c42;
      --text-light: #f8f9fa;
      --text-muted: #b0b7c8;
      --success: #3dd7b8;
      --danger: #ff5d62;
      --warning: #f7df1e;
      --info: #5c7cfa;
      --border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.12);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.15);
      --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.2);
      --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: var(--font-main);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      background-image: linear-gradient(to bottom right, rgba(15, 17, 26, 0.99), rgba(22, 25, 37, 0.94)), 
                        url('https://i.imgur.com/s9YP5HG.png');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      border-radius: var(--border-radius);
      background: var(--bg-panel);
      box-shadow: var(--shadow-md);
      flex-wrap: wrap;
      gap: 15px;
      position: relative;
      overflow: hidden;
    }
    
    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--success), var(--info));
    }
    
    h1 {
      color: var(--text-light);
      font-size: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      position: relative;
      margin-bottom: 5px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    @media (min-width: 768px) {
      h1 {
        width: auto;
      }
    }
    
    h1 i {
      color: var(--danger);
      filter: drop-shadow(0 2px 3px rgba(255, 93, 98, 0.3));
    }
    
    h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 3px;
      background: var(--primary);
      border-radius: 10px;
    }
    
    h2 {
      font-size: 22px;
      margin-bottom: 18px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      padding-bottom: 10px;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 2px;
      background: var(--primary);
      border-radius: 10px;
    }
    
    h2 i {
      color: var(--primary);
    }
    
    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    
    @media (min-width: 992px) {
      .dashboard {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 0;
      }
      
      body {
        padding: 10px;
      }
    }
    
    .panel {
      background: var(--bg-panel);
      border-radius: var(--border-radius);
      padding: 25px;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }
    
    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle at top right,
        rgba(255, 255, 255, 0.03),
        transparent 70%
      );
      pointer-events: none;
    }
    
    .panel:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--bg-panel-light);
      padding: 20px 15px;
      border-radius: var(--border-radius);
      text-align: center;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, 
        var(--primary) 0%, 
        var(--primary-dark) 100%
      );
      opacity: 0;
      transition: var(--transition);
    }
    
    @media (min-width: 768px) {
      .stats-container {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
      }
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
    }
    
    .stat-card:hover::after {
      opacity: 1;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin: 8px 0;
      background: linear-gradient(45deg, var(--primary), var(--danger));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 93, 98, 0.2);
    }
    
    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
    }
    
    .online {
      color: var(--success);
    }
    
    .battling {
      color: var(--danger);
    }
    
    .exploring {
      color: var(--info);
    }
    
    .ended {
      color: var(--warning);
    }
    
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 20px;
      border-radius: var(--border-radius);
      background: var(--bg-panel-light);
      box-shadow: var(--shadow-sm);
    }
    
    table {
      width: 100%;
      min-width: 480px;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: var(--border-radius);
      overflow: hidden;
    }
    
    thead {
      background: rgba(0, 0, 0, 0.2);
    }
    
    th, td {
      padding: 14px 18px;
      text-align: left;
    }
    
    tr:not(:last-child) td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    @media (max-width: 480px) {
      th, td {
        padding: 10px 12px;
      }
    }
    
    th {
      color: var(--text-light);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }
    
    tr {
      transition: var(--transition);
    }
    
    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }
    
    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--danger));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(255, 93, 98, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .user-avatar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0));
      z-index: 1;
    }
    
    .avatar-glow {
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      background: var(--primary);
      z-index: -1;
      opacity: 0;
      filter: blur(8px);
      transition: opacity 0.3s ease;
    }
    
    .user-avatar:hover .avatar-glow {
      opacity: 0.4;
      animation: pulse 2s infinite;
    }
    
    @keyframes glow-pulse {
      0% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.05); }
      100% { opacity: 0.2; transform: scale(1); }
    }
    
    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-light);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      font-size: 13px;
    }
    
    .action-btn i {
      color: var(--primary);
      transition: var(--transition);
    }
    
    .action-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 93, 98, 0.25);
    }
    
    .action-btn:hover i {
      color: white;
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    .log-container {
      background: var(--bg-panel-light);
      border-radius: var(--border-radius);
      padding: 20px;
      height: 480px;
      overflow-y: auto;
      font-size: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .log-entry {
      margin-bottom: 15px;
      padding: 15px;
      background: var(--bg-panel);
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-left: 3px solid transparent;
    }
    
    .log-entry:hover {
      transform: translateX(5px);
      border-left-color: var(--primary);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    
    .log-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }
    
    .log-time {
      color: var(--text-muted);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 12px;
    }
    
    .status-badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    
    .status-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 3px;
    }
    
    .badge-exploring {
      background: rgba(61, 215, 184, 0.15);
      color: var(--success);
      border: 1px solid rgba(61, 215, 184, 0.3);
    }
    
    .badge-exploring::before {
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(61, 215, 184, 0.3);
    }
    
    .badge-battling {
      background: rgba(255, 93, 98, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 93, 98, 0.3);
    }
    
    .badge-battling::before {
      background: var(--danger);
      box-shadow: 0 0 0 2px rgba(255, 93, 98, 0.3);
    }
    
    .badge-ended {
      background: rgba(247, 223, 30, 0.15);
      color: var(--warning);
      border: 1px solid rgba(247, 223, 30, 0.3);
    }
    
    .badge-ended::before {
      background: var(--warning);
      box-shadow: 0 0 0 2px rgba(247, 223, 30, 0.3);
    }
    
    .refresh-btn {
      background: var(--primary);
      color: var(--bg-dark);
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }
    
    .refresh-btn:hover {
      background: var(--primary-dark);
    }
    
    .search-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 18px;
      border-radius: var(--border-radius);
      color: var(--text-light);
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      font-size: 15px;
      padding-left: 40px;
      position: relative;
    }
    
    .search-box-container {
      position: relative;
      max-width: 400px;
    }
    
    .search-box-container::before {
      content: '\f002';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      z-index: 1;
      font-size: 14px;
    }
    
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(255, 93, 98, 0.25);
    }
    
    .search-box::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.1);
      border-radius: var(--border-radius);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      margin: 10px 0;
    }
    
    .empty-state i {
      font-size: 50px;
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.1);
      display: block;
    }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-panel);
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      border-radius: 10px;
      border: 2px solid var(--bg-panel);
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--primary-dark), var(--danger));
    }
    
    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }
    
    .pulse {
      animation: pulse 1.5s infinite;
    }
    
    @keyframes loading-gradient {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .is-loading .panel {
      position: relative;
    }
    
    .is-loading .panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, 
        rgba(255, 93, 98, 0),
        var(--primary),
        rgba(255, 93, 98, 0)
      );
      background-size: 200% 100%;
      animation: loading-gradient 2s infinite linear;
    }
    
    .stat-card.loading {
      position: relative;
      overflow: hidden;
    }
    
    .stat-card.loading::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.05),
        transparent
      );
      animation: loading-shine 1.5s infinite;
    }
    
    @keyframes loading-shine {
      0% { left: -100%; }
      100% { left: 150%; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .dashboard > .panel {
      animation: fadeIn 0.5s ease-out forwards;
    }
    
    .dashboard > .panel:nth-child(2) {
      animation-delay: 0.15s;
    }
    
    .stat-card {
      animation: fadeIn 0.3s ease-out forwards;
    }
    
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    
    /* Tooltip */
    .tooltip {
      position: relative;
      display: inline-block;
    }
    
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 120px;
      background-color: var(--bg-panel);
      color: var(--text-light);
      text-align: center;
      border-radius: 8px;
      padding: 8px;
      position: absolute;
      z-index: 1;
      bottom: 130%;
      left: 50%;
      margin-left: -60px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: translateY(10px);
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }
    
    .tooltip .tooltiptext::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--bg-panel) transparent transparent transparent;
    }
    
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }
    
    /* Responsive header styles */
    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
      width: 100%;
    }
    
    @media (min-width: 768px) {
      .header-controls {
        width: auto;
      }
    }
    
    .user-info {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    
    .user-info::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        transparent, 
        rgba(255, 255, 255, 0.05), 
        transparent
      );
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    
    @media (min-width: 480px) {
      .user-info {
        text-align: right;
        width: auto;
      }
    }
    
    .user-info strong {
      color: var(--primary);
      font-weight: 600;
    }
    
    .user-info small {
      color: var(--text-muted);
      margin-top: 3px;
      display: block;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    @media (min-width: 480px) {
      .button-group {
        justify-content: flex-end;
        width: auto;
      }
    }
    
    .refresh-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
      flex: 1;
      justify-content: center;
      min-width: 80px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(255, 93, 98, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 13px;
    }
    
    .refresh-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 93, 98, 0.3);
    }
    
    .refresh-btn:active {
      transform: translateY(0);
    }
    
    @media (min-width: 480px) {
      .refresh-btn {
        flex: 0 0 auto;
      }
    }
    
    .logout-btn {
      text-decoration: none;
      background: linear-gradient(45deg, var(--danger), #ff7730);
    }
    
    @media (max-width: 360px) {
      .btn-text {
        display: none;
      }
      
      .refresh-btn {
        padding: 8px;
        min-width: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-logo">
        <h1>
          <i class="fas fa-robot"></i> 
          <span style="background: linear-gradient(45deg, var(--text-light), #f5f5f5);
                       -webkit-background-clip: text; background-clip: text;
                       -webkit-text-fill-color: transparent;">
            AoT Bot Live Dashboard
          </span>
        </h1>
        <div class="version-badge" style="display: inline-block; background: rgba(255,255,255,0.1); 
             padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 15px;
             border: 1px solid rgba(255,255,255,0.05);">
          <i class="fas fa-code-branch" style="margin-right: 3px;"></i> v1.0.2
        </div>
      </div>
      <div class="header-controls">
        <div class="user-info">
          <i class="fas fa-user-shield"></i> 
          <strong>{{ user_role }}</strong><br>
          <small><i class="fas fa-clock"></i> Accessed: {{ login_time }}</small>
        </div>
        <div class="button-group">
          <a href="/logout" class="refresh-btn logout-btn">
            <i class="fas fa-sign-out-alt"></i> <span class="btn-text">Logout</span>
          </a>
        </div>
      </div>
    </header>
    
    <div class="stats-container" id="stats-container">
      <div class="stat-card">
        <div class="stat-label">Memory Usage</div>
        <div class="stat-value exploring" id="exploring-count">0 MB</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Battling</div>
        <div class="stat-value battling" id="battling-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CPU Usage</div>
        <div class="stat-value ended" id="ended-count">0%</div>
      </div>
    </div>
    
    <div class="dashboard">
      <div class="panel">
        <h2><i class="fas fa-users"></i> Active Players</h2>
        <div class="search-box-container">
          <input type="text" class="search-box" id="player-search" placeholder="Search players by name or ID...">
        </div>
        <div class="table-container">
          <table id="active-players-table">
            <thead>
              <tr>
                <th><i class="fas fa-user fa-sm"></i> Player</th>
                <th><i class="fas fa-signal fa-sm"></i> Status</th>
                <th><i class="fas fa-cog fa-sm"></i> Actions</th>
              </tr>
            </thead>
            <tbody id="active-players-body">
              <tr>
                <td colspan="3" class="empty-state">
                  <i class="fas fa-spinner pulse"></i>
                  <span>Loading player data...</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <div class="panel">
        <h2><i class="fas fa-scroll"></i> Live Activity Log</h2>
        <div class="log-container" id="log-container">
          <div class="empty-state">
            <i class="fas fa-spinner pulse"></i><br>
            Loading activity logs...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const playerSearch = document.getElementById('player-search');
    const activePlayersBody = document.getElementById('active-players-body');
    const logContainer = document.getElementById('log-container');
    const statsContainer = {
      exploring: document.getElementById('exploring-count'),
      battling: document.getElementById('battling-count'),
      ended: document.getElementById('ended-count')
    };
    
    // State
    let allPlayers = [];
    let filteredPlayers = [];
    let lastUpdateTime = 0;
    let updateCounter = 0;
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Add animation classes to make initial load look nice
      document.querySelectorAll('.stat-card').forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        setTimeout(() => {
          card.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, 100 * index);
      });
      
      document.querySelectorAll('.panel').forEach((panel, index) => {
        panel.style.opacity = '0';
        panel.style.transform = 'translateY(20px)';
        setTimeout(() => {
          panel.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
          panel.style.opacity = '1';
          panel.style.transform = 'translateY(0)';
        }, 300 + (100 * index));
      });
      
      // Initial data fetch
      fetchAndUpdate();
      
      // Set up auto-refresh every 2 seconds
      setInterval(fetchAndUpdate, 2000);
      
      // Add search functionality
      playerSearch.addEventListener('input', filterPlayers);
      
      // Add pulse effect to stat cards on hover
      document.querySelectorAll('.stat-card').forEach(card => {
        card.addEventListener('mouseenter', function() {
          const value = this.querySelector('.stat-value');
          if (value) value.classList.add('pulse');
        });
        
        card.addEventListener('mouseleave', function() {
          const value = this.querySelector('.stat-value');
          if (value) value.classList.remove('pulse');
        });
      });
    });
    
    // Enhanced fetch data and update UI with loading indicators
    function fetchAndUpdate() {
      // Don't make too many requests at once
      const now = Date.now();
      if (now - lastUpdateTime < 1000) return; // Prevent updates more than once per second
      
      lastUpdateTime = now;
      updateCounter++;
      
      // Add subtle loading indication without disrupting UX
      document.body.classList.add('is-loading');
      
      // Subtle pulse effect on stat cards during loading
      const statCards = document.querySelectorAll('.stat-card');
      statCards.forEach(card => card.classList.add('loading'));
      
      fetch('/monitor')
        .then(response => {
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              // Redirect to login page if unauthorized
              window.location.href = '/login';
              throw new Error('Unauthorized: Please log in');
            }
            throw new Error('Network response was not ok: ' + response.status);
          }
          return response.json();
        })
        .then(data => {
          console.log('Response data:', data); // Debug logging
          
          // Remove loading state
          document.body.classList.remove('is-loading');
          statCards.forEach(card => card.classList.remove('loading'));
          
          if (data.status === 'error') {
            console.error('Server returned error:', data.error, data.details);
            throw new Error(data.error || 'Unknown error occurred');
          }
          
          if (!data.live_players) {
            console.error('Missing live_players data in response:', data);
            throw new Error('Invalid data format: missing player information');
          }
          
          // Only show a success toast on first successful load
          if (updateCounter === 1) {
            setTimeout(() => {
              showToast('Dashboard successfully connected!', 'success');
            }, 500);
          }
          
          updateDashboard(data);
        })
        .catch(err => {
          console.error('Error fetching data:', err);
          
          // Remove loading state
          document.body.classList.remove('is-loading');
          statCards.forEach(card => card.classList.remove('loading'));
          
          showError(err.message);
        });
    }
    
    // Update dashboard with new data
    function updateDashboard(data) {
      // Handle sessions data if available
      if (data.active_sessions_count !== undefined) {
        console.log(`Active sessions: ${data.active_sessions_count}`);
      }
      
      try {
        // Use backend stats directly with fallbacks for missing data
        const stats = data.live_players || {};
        
        // Get memory and CPU usage from the response
        let memoryUsage = "0 MB";
        let cpuUsage = "0%";
        
        // Check if the memory_usage and cpu_usage are available in data
        if (data.memory_usage && data.memory_usage.rss_mb !== undefined) {
          memoryUsage = `${data.memory_usage.rss_mb} MB`;
        }
        
        if (data.system_load && data.system_load.cpu_percent !== undefined) {
          cpuUsage = `${data.system_load.cpu_percent}%`;
        }
        
        // Update stat counters with fallback values
        document.getElementById('exploring-count').textContent = memoryUsage;
        document.getElementById('battling-count').textContent = stats.in_battle !== undefined ? stats.in_battle : 0;
        document.getElementById('ended-count').textContent = cpuUsage;
        
        // Process players data with safety checks
        const playersRaw = Array.isArray(stats.players) ? stats.players : [];
        const uniquePlayersMap = {};
        
        playersRaw.forEach(player => {
          if (!player || typeof player !== 'object') return;
          
          // Ensure user_id exists and convert to string if needed
          const id = player.user_id ? String(player.user_id) : null;
          if (!id) return;
          
          // Only add or replace if it's a better quality entry
          if (!uniquePlayersMap[id] || 
              (uniquePlayersMap[id].username === 'Unknown' && 
               player.username && 
               player.username !== 'Unknown')) {
            uniquePlayersMap[id] = player;
          }
        });
        
        allPlayers = Object.values(uniquePlayersMap);
        filterPlayers();
        
        // If we successfully processed data, schedule next update
        setTimeout(fetchAndUpdate, 2000);
        
      } catch (err) {
        console.error('Error processing dashboard data:', err);
        showError('Error processing data: ' + err.message);
        
        // Try again after a delay
        setTimeout(fetchAndUpdate, 5000);
      }
    }
    
    // Filter players based on search input
    function filterPlayers() {
      try {
        const searchTerm = playerSearch.value.toLowerCase();
        filteredPlayers = allPlayers.filter(player => {
          try {
            if (!player) return false;
            
            // Safely handle username - ensure it's a string
            const username = player.username || 'Unknown';
            const name = String(username);
            
            // Safely handle user_id - ensure it's a string
            const userId = player.user_id;
            const id = userId ? String(userId) : '';
            
            return name.toLowerCase().includes(searchTerm) || id.toLowerCase().includes(searchTerm);
          } catch (err) {
            console.error('Error filtering player:', err, player);
            return false;
          }
        });
        
        renderPlayersTable();
      } catch (err) {
        console.error('Error in filterPlayers:', err);
      }
    }
    
    // Render players table
    function renderPlayersTable() {
      try {
        if (filteredPlayers.length === 0) {
          activePlayersBody.innerHTML = `
            <tr>
              <td colspan="3" class="empty-state">
                <i class="fas fa-user-slash"></i><br>
                No players found
              </td>
            </tr>
          `;
          return;
        }
        
        // Sort by most recent activity
        const sortedPlayers = [...filteredPlayers].sort((a, b) => (b.duration || 0) - (a.duration || 0));
        
        let tableHTML = '';
        
        for (let player of sortedPlayers) {
          try {
            // Skip invalid player objects
            if (!player) continue;
            
            // Safely extract player data with defaults
            const username = player.username || 'Unknown';
            const user_id = player.user_id ? String(player.user_id) : '';
            const action = player.action || 'Unknown';
            
            // Safely generate initials
            let initials = 'U';
            try {
              const name = String(username);
              initials = name
                .split(' ')
                .filter(part => part && part.length > 0)
                .map(n => n[0] || '')
                .join('')
                .toUpperCase() || 'U';
            } catch (e) {
              console.error('Error generating initials:', e);
            }
            
            let status = '';
            let statusClass = '';
            
            // Safely check action string
            try {
              const actionStr = String(action).toLowerCase();
              if (actionStr.includes('exploring')) {
                status = 'Exploring';
                statusClass = 'exploring';
              } else if (actionStr.includes('battle') || action === '🔥 In Battle') {
                status = 'Battling';
                statusClass = 'battling';
              } else if (String(action).startsWith('🏁')) {
                status = 'Ended';
                statusClass = 'ended';
              } else {
                status = action;
              }
            } catch (e) {
              console.error('Error determining status:', e);
              status = 'Unknown';
              statusClass = '';
            }
            
            tableHTML += `
              <tr class="player-row" style="animation: fadeIn 0.3s ease-out forwards; animation-delay: ${0.05 * (tableHTML.length / 500)}s; opacity: 0;">
                <td>
                  <div class="user-cell">
                    <div class="user-avatar">
                      ${initials.substring(0, 2)}
                      <span class="avatar-glow"></span>
                    </div>
                    <div>
                      <div style="font-weight: 500;">${username}</div>
                      <div style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px;">
                        <i class="fas fa-fingerprint" style="font-size: 10px;"></i>${user_id}
                      </div>
                    </div>
                  </div>
                </td>
                <td>
                  <span class="status-badge badge-${statusClass}">${status}</span>
                </td>
                <td>
                  <div class="action-buttons" style="display: flex; gap: 8px;">
                    <button class="action-btn tooltip" onclick="copyToClipboard('${user_id}')">
                      <i class="far fa-copy"></i>
                      <span class="tooltiptext">Copy ID</span>
                    </button>
                    <button class="action-btn tooltip" onclick="showPlayerDetails('${user_id}')">
                      <i class="fas fa-search"></i>
                      <span class="tooltiptext">View Details</span>
                    </button>
                  </div>
                </td>
              </tr>
            `;
          } catch (err) {
            console.error('Error rendering player row:', err);
            // Continue with the next player if one fails
            continue;
          }
        }
        
        activePlayersBody.innerHTML = tableHTML;
        
        // Update logs
        updateLogs(sortedPlayers);
      } catch (err) {
        console.error('Error in renderPlayersTable:', err);
        showError('Error rendering player data: ' + err.message);
      }
    }
    
    // Update activity logs
    function updateLogs(players) {
      try {
        // Show only the latest log per user, exclude 'Ended' status
        const logs = [];
        const addedPlayers = new Set();
        
        for (let player of players) {
          try {
            if (!player) continue;
            
            const username = player.username || 'Unknown';
            const user_id = player.user_id ? String(player.user_id) : '';
            const action = player.action || 'Unknown';
            const duration = player.duration || 0;
            
            // Skip ended actions and players we've already added
            if (String(action).startsWith('🏁') || addedPlayers.has(user_id)) continue;
            
            addedPlayers.add(user_id);
            
            let status = '';
            let statusClass = '';
            
            if (String(action).toLowerCase().includes('exploring')) {
              status = 'Exploring';
              statusClass = 'exploring';
            } else if (String(action).toLowerCase().includes('battle') || action === '🔥 In Battle') {
              status = 'Battling';
              statusClass = 'battling';
            } else {
              status = action;
            }
            
            const timeAgo = Math.round(duration);
            
            // Generate user initial safely
            let initial = 'U';
            try {
              initial = String(username).substring(0, 1).toUpperCase() || 'U';
            } catch (e) {
              console.error('Error generating initial:', e);
            }
            
            logs.push(`
              <div class="log-entry" style="animation: fadeIn 0.3s ease-out forwards; animation-delay: ${0.05 * logs.length}s; opacity: 0;">
                <div class="log-user">
                  <div class="user-avatar">
                    ${initial}
                    <span class="avatar-glow"></span>
                  </div>
                  <div>
                    <div style="font-weight: 500;">${username}</div>
                    <div style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px;">
                      <i class="fas fa-fingerprint" style="font-size: 10px;"></i>${user_id}
                    </div>
                  </div>
                  <span class="status-badge badge-${statusClass}">${status}</span>
                </div>
                <div class="log-time">
                  <i class="far fa-clock" style="margin-right: 4px; font-size: 11px;"></i>
                  ${timeAgo}s ago
                </div>
              </div>
            `);
          } catch (err) {
            console.error('Error processing log entry:', err);
            // Continue with next player if one fails
            continue;
          }
        }
        
        if (logs.length === 0) {
          logContainer.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-comment-slash"></i><br>
              No recent activity
            </div>
          `;
        } else {
          logContainer.innerHTML = logs.join('');
        }
      } catch (err) {
        console.error('Error in updateLogs:', err);
        logContainer.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i><br>
            Error loading logs
          </div>
        `;
      }
    }
    
    // Show error state with enhanced visuals
    function showError(errorMessage) {
      const errorDetails = errorMessage ? `
        <div style="font-size: 14px; color: var(--danger); margin-top: 15px; padding: 10px 15px; 
                    background: rgba(255, 93, 98, 0.1); border-radius: 8px; display: inline-block;
                    border: 1px solid rgba(255, 93, 98, 0.2);">
          <i class="fas fa-code" style="margin-right: 6px;"></i>
          ${errorMessage}
        </div>` : '';
      
      activePlayersBody.innerHTML = `
        <tr>
          <td colspan="3" class="empty-state">
            <div class="error-icon-wrapper" style="background: rgba(255, 93, 98, 0.1); 
                 width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;
                 display: flex; align-items: center; justify-content: center;
                 box-shadow: 0 0 0 8px rgba(255, 93, 98, 0.05);">
              <i class="fas fa-exclamation-triangle" style="color: var(--danger); font-size: 34px;"></i>
            </div>
            <div style="font-size: 18px; font-weight: 600; margin-bottom: 5px;">Error Loading Data</div>
            <div style="margin-bottom: 15px; color: var(--text-muted);">
              Please try again in a few moments
            </div>
            ${errorDetails}
          </td>
        </tr>
      `;
      
      logContainer.innerHTML = `
        <div class="empty-state">
          <div class="error-icon-wrapper" style="background: rgba(255, 93, 98, 0.1); 
               width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 20px;
               display: flex; align-items: center; justify-content: center;
               box-shadow: 0 0 0 8px rgba(255, 93, 98, 0.05);">
            <i class="fas fa-exclamation-triangle" style="color: var(--danger); font-size: 28px;"></i>
          </div>
          <div style="font-size: 18px; font-weight: 600; margin-bottom: 5px;">Error Loading Logs</div>
          <div style="margin-bottom: 15px; color: var(--text-muted);">
            Unable to retrieve activity logs
          </div>
          ${errorDetails}
        </div>
      `;
      
      // Also update the stats to show error state with visual indicator
      document.getElementById('exploring-count').innerHTML = '<span style="color: var(--danger);">- MB</span>';
      document.getElementById('battling-count').innerHTML = '<span style="color: var(--danger);">-</span>';
      document.getElementById('ended-count').innerHTML = '<span style="color: var(--danger);">-%</span>';
      
      // Show a toast notification
      showToast('Connection error. Retrying...', 'error');
    }
    
    // Utility functions
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text)
        .then(() => {
          showToast(`ID copied to clipboard: ${text}`, 'success');
        })
        .catch(err => {
          console.error('Failed to copy:', err);
          showToast('Failed to copy to clipboard', 'error');
        });
    }
    
    function showPlayerDetails(userId) {
      // In a real implementation, this would show a modal with detailed player info
      showToast(`Loading player details for ID: ${userId}`, 'info');
      
      // Simulate loading data
      setTimeout(() => {
        // Here we would normally make an API call to get player details
        // For now, just show another toast as feedback
        showToast(`Player details feature coming soon!`, 'warning');
      }, 1000);
    }
    
    function showToast(message, type = 'info') {
      // Enhanced toast notification with type support
      const toast = document.createElement('div');
      toast.style.position = 'fixed';
      toast.style.bottom = '25px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%) translateY(100px)';
      toast.style.backgroundColor = 'var(--bg-panel)';
      toast.style.color = 'var(--text-light)';
      toast.style.padding = '15px 20px';
      toast.style.borderRadius = '10px';
      toast.style.boxShadow = 'var(--shadow-lg)';
      toast.style.zIndex = '1000';
      toast.style.transition = 'all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
      toast.style.opacity = '0';
      toast.style.maxWidth = '90%';
      toast.style.textAlign = 'center';
      toast.style.display = 'flex';
      toast.style.alignItems = 'center';
      toast.style.gap = '12px';
      toast.style.border = '1px solid rgba(255, 255, 255, 0.08)';
      
      // Icon based on type
      let iconClass = 'info-circle';
      let iconColor = 'var(--info)';
      
      if (type === 'success') {
        iconClass = 'check-circle';
        iconColor = 'var(--success)';
        toast.style.borderLeft = '4px solid var(--success)';
      } else if (type === 'error') {
        iconClass = 'exclamation-circle';
        iconColor = 'var(--danger)';
        toast.style.borderLeft = '4px solid var(--danger)';
      } else if (type === 'warning') {
        iconClass = 'exclamation-triangle';
        iconColor = 'var(--warning)';
        toast.style.borderLeft = '4px solid var(--warning)';
      } else {
        toast.style.borderLeft = '4px solid var(--info)';
      }
      
      // Create icon element
      const icon = document.createElement('i');
      icon.className = `fas fa-${iconClass}`;
      icon.style.color = iconColor;
      icon.style.fontSize = '20px';
      
      // Create text element
      const text = document.createElement('span');
      text.textContent = message;
      text.style.fontWeight = '500';
      
      toast.appendChild(icon);
      toast.appendChild(text);
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(0)';
        toast.style.opacity = '1';
      }, 10);
      
      setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(100px)';
        toast.style.opacity = '0';
        setTimeout(() => {
          document.body.removeChild(toast);
        }, 400);
      }, 3000);
    }
  </script>
</body>
</html>
